<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Galactic Shooter</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Мобильная оптимизация жестов */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05050f; font-family: sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* Стили для скролла в магазине */
    .shop-scroll::-webkit-scrollbar { width: 4px; }
    .shop-scroll::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
  </style>
</head>
<body class="text-white flex items-center justify-center">

  <div id="game-container" class="relative w-full h-full max-w-[500px] max-h-[900px] overflow-hidden shadow-2xl bg-[#05050f]">
    <canvas id="gameCanvas"></canvas>

    <!-- Игровой HUD -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none hidden">
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-cyan-500/30">
          <span class="text-cyan-400 font-bold text-sm">ОЧКИ:</span>
          <span id="scoreDisplay" class="font-extrabold text-cyan-300">0</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1 rounded-full border border-purple-500/30 w-fit">
          <span class="text-purple-400 font-bold text-xs">ВОЛНА:</span>
          <span id="waveDisplay" class="font-bold text-purple-300 text-xs">1</span>
        </div>
      </div>
      <div class="flex flex-col gap-1 items-end">
        <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-emerald-500/30">
          <span class="text-emerald-400 font-bold text-sm">💎</span>
          <span id="coinsDisplay" class="font-extrabold text-emerald-300">0</span>
        </div>
        <!-- Индикаторы активных баффов -->
        <div id="buffsDisplay" class="flex gap-1"></div>
      </div>
    </div>

    <!-- Полоска здоровья Босса -->
    <div id="bossBarContainer" class="absolute top-16 left-1/2 -translate-x-1/2 w-3/4 max-w-[300px] bg-slate-950/90 border border-red-500/50 rounded-full p-1 hidden pointer-events-none">
      <div class="text-[10px] text-red-400 text-center font-bold uppercase mb-0.5">Вражеский Босс</div>
      <div class="w-full bg-slate-900 rounded-full h-2.5">
        <div id="bossBarFill" class="bg-red-500 h-full w-full"></div>
      </div>
    </div>

    <!-- Главное Меню -->
    <div id="mainMenu" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 z-20">
      <h1 class="text-4xl font-black italic tracking-wider text-cyan-400 mb-8 drop-shadow-md">NEON SHOOTER</h1>
      
      <div class="w-full max-w-[280px] flex flex-col gap-3">
        <button id="startBtn" class="w-full py-4 bg-cyan-600 rounded-xl font-black text-lg tracking-wider active:scale-95 transition-transform">ИГРАТЬ</button>
        <button id="shopBtn" class="w-full py-3 bg-purple-600 rounded-xl font-bold active:scale-95 transition-transform">МАГАЗИН</button>
        <button id="supportBtn" class="w-full py-3 bg-amber-600 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center gap-2">
          <span id="supportBtnText">Поддержать автора (+1000 💎)</span>
        </button>
      </div>
      <div class="mt-6 text-sm text-slate-400">Рекорд: <span id="highScoreDisplay" class="text-white font-bold">0</span></div>
      <div class="mt-2 text-sm text-emerald-400 font-bold">Кристаллы: <span id="menuCoinsDisplay">0</span> 💎</div>
    </div>

    <!-- Магазин -->
    <div id="shopMenu" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center p-6 z-30 hidden">
      <div class="flex justify-between w-full mb-4 items-center">
        <h2 class="text-2xl font-black text-purple-400">МАГАЗИН</h2>
        <div class="text-emerald-400 font-bold"><span id="shopCoinsDisplay">0</span> 💎</div>
      </div>
      
      <div class="flex gap-2 w-full mb-4">
        <button id="tabSkins" class="flex-1 bg-purple-600 py-2 rounded-lg font-bold text-sm">Корабли</button>
        <button id="tabWeapons" class="flex-1 bg-slate-700 py-2 rounded-lg font-bold text-sm">Оружие</button>
      </div>

      <div id="shopContent" class="w-full flex-1 overflow-y-auto shop-scroll flex flex-col gap-3 pb-4">
        <!-- Товары генерируются JS -->
      </div>

      <button id="closeShopBtn" class="w-full mt-4 py-3 bg-slate-700 rounded-xl font-bold active:scale-95 transition-transform">НАЗАД В МЕНЮ</button>
    </div>

    <!-- Экран Game Over -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 z-20 hidden">
      <h2 class="text-3xl font-black text-red-500 mb-4">УНИЧТОЖЕН</h2>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 w-full max-w-[280px] mb-6">
        <div class="flex justify-between text-sm mb-2"><span class="text-slate-400">Очки:</span><span id="finalScore" class="font-bold text-cyan-400">0</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">Собрано:</span><span id="finalCoins" class="font-bold text-emerald-400">0 💎</span></div>
      </div>
      <button id="restartBtn" class="w-full max-w-[280px] py-4 bg-cyan-600 rounded-xl font-black active:scale-95 transition-transform">В МЕНЮ</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // false убирает прозрачность фона для FPS
    const container = document.getElementById('game-container');

    // UI элементы
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const waveDisplay = document.getElementById('waveDisplay');
    const coinsDisplay = document.getElementById('coinsDisplay');
    const buffsDisplay = document.getElementById('buffsDisplay');
    const bossBarContainer = document.getElementById('bossBarContainer');
    const bossBarFill = document.getElementById('bossBarFill');
    
    // Экраны
    const mainMenu = document.getElementById('mainMenu');
    const shopMenu = document.getElementById('shopMenu');
    const gameOverScreen = document.getElementById('gameOverScreen');
    
    // Кнопки и текст
    const startBtn = document.getElementById('startBtn');
    const shopBtn = document.getElementById('shopBtn');
    const supportBtn = document.getElementById('supportBtn');
    const supportBtnText = document.getElementById('supportBtnText');
    const closeShopBtn = document.getElementById('closeShopBtn');
    const restartBtn = document.getElementById('restartBtn');
    const tabSkins = document.getElementById('tabSkins');
    const tabWeapons = document.getElementById('tabWeapons');
    const shopContent = document.getElementById('shopContent');

    // ОПТИМИЗАЦИЯ: Ограничиваем DPR (пиксели) для мобилок
    let width = 0; let height = 0;
    const DPR = Math.min(window.devicePixelRatio || 1, 1.5); 

    function resize() {
      const rect = container.getBoundingClientRect();
      width = rect.width; height = rect.height;
      canvas.width = width * DPR; canvas.height = height * DPR;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(DPR, DPR);
    }
    window.addEventListener('resize', resize);
    resize();

    // Сохранения (База данных)
    let savedData = JSON.parse(localStorage.getItem('neon_data')) || {
      coins: 0, highScore: 0, isSupporter: false,
      ownedSkins: ['skin_1'], equippedSkin: 'skin_1',
      ownedWeapons: ['wpn_1'], equippedWeapon: 'wpn_1'
    };
    function saveData() { localStorage.setItem('neon_data', JSON.stringify(savedData)); }

    // Конфиг магазина
    const STORE = {
      skins: [
        { id: 'skin_1', name: 'Базовый', price: 0, color: '#0284c7' },
        { id: 'skin_2', name: 'Красный Дьявол', price: 500, color: '#dc2626' },
        { id: 'skin_3', name: 'Токсик', price: 1000, color: '#16a34a' },
        { id: 'skin_4', name: 'Призрак', price: 2000, color: '#9333ea' }
      ],
      weapons: [
        { id: 'wpn_1', name: 'Одинарный', price: 0, desc: '1 пуля', rate: 0.2 },
        { id: 'wpn_2', name: 'Двойной', price: 800, desc: '2 пули', rate: 0.2 },
        { id: 'wpn_3', name: 'Пулемет', price: 2000, desc: 'Быстрый огонь', rate: 0.1 },
        { id: 'wpn_4', name: 'Тройной', price: 4000, desc: 'Веерный огонь', rate: 0.25 }
      ]
    };

    let currentShopTab = 'skins';

    function updateMenuUI() {
      document.getElementById('highScoreDisplay').innerText = savedData.highScore;
      document.getElementById('menuCoinsDisplay').innerText = savedData.coins;
      document.getElementById('shopCoinsDisplay').innerText = savedData.coins;
      
      if (savedData.isSupporter) {
        supportBtnText.innerText = "Поддержка активна ✓";
        supportBtn.classList.add('opacity-50', 'pointer-events-none');
      }
    }

    // Поддержка
    supportBtn.addEventListener('click', () => {
      if (!savedData.isSupporter) {
        savedData.isSupporter = true;
        savedData.coins += 1000;
        saveData();
        updateMenuUI();
      }
    });

    // Логика магазина
    shopBtn.addEventListener('click', () => { mainMenu.classList.add('hidden'); shopMenu.classList.remove('hidden'); renderShop(); });
    closeShopBtn.addEventListener('click', () => { shopMenu.classList.add('hidden'); mainMenu.classList.remove('hidden'); updateMenuUI(); });
    
    tabSkins.addEventListener('click', () => { currentShopTab = 'skins'; tabSkins.classList.replace('bg-slate-700','bg-purple-600'); tabWeapons.classList.replace('bg-purple-600','bg-slate-700'); renderShop(); });
    tabWeapons.addEventListener('click', () => { currentShopTab = 'weapons'; tabWeapons.classList.replace('bg-slate-700','bg-purple-600'); tabSkins.classList.replace('bg-purple-600','bg-slate-700'); renderShop(); });

    function renderShop() {
      shopContent.innerHTML = '';
      const items = STORE[currentShopTab];
      const ownedList = currentShopTab === 'skins' ? savedData.ownedSkins : savedData.ownedWeapons;
      const equipped = currentShopTab === 'skins' ? savedData.equippedSkin : savedData.equippedWeapon;

      items.forEach(item => {
        const isOwned = ownedList.includes(item.id);
        const isEquipped = equipped === item.id;
        
        const div = document.createElement('div');
        div.className = 'bg-slate-800 p-3 rounded-xl border flex justify-between items-center ' + (isEquipped ? 'border-cyan-500' : 'border-slate-700');
        
        let btnHtml = '';
        if (isEquipped) {
          btnHtml = `<button class="px-4 py-1.5 bg-cyan-600/50 text-cyan-200 rounded font-bold text-sm" disabled>Выбрано</button>`;
        } else if (isOwned) {
          btnHtml = `<button onclick="equipItem('${item.id}')" class="px-4 py-1.5 bg-cyan-600 rounded font-bold text-sm">Выбрать</button>`;
        } else {
          const canAfford = savedData.coins >= item.price;
          btnHtml = `<button onclick="buyItem('${item.id}', ${item.price})" class="px-4 py-1.5 ${canAfford ? 'bg-emerald-600' : 'bg-slate-600'} rounded font-bold text-sm">${item.price} 💎</button>`;
        }

        div.innerHTML = `
          <div class="flex items-center gap-3">
            ${currentShopTab === 'skins' ? `<div class="w-6 h-6 rounded-sm" style="background:${item.color}"></div>` : '💥'}
            <div>
              <div class="font-bold text-sm text-white">${item.name}</div>
              ${item.desc ? `<div class="text-xs text-slate-400">${item.desc}</div>` : ''}
            </div>
          </div>
          ${btnHtml}
        `;
        shopContent.appendChild(div);
      });
    }

    window.buyItem = function(id, price) {
      if (savedData.coins >= price) {
        savedData.coins -= price;
        if (currentShopTab === 'skins') savedData.ownedSkins.push(id);
        else savedData.ownedWeapons.push(id);
        equipItem(id); // Сразу экипируем
      }
    };
    
    window.equipItem = function(id) {
      if (currentShopTab === 'skins') savedData.equippedSkin = id;
      else savedData.equippedWeapon = id;
      saveData();
      renderShop();
      document.getElementById('shopCoinsDisplay').innerText = savedData.coins;
    };

    // --- ИГРОВАЯ ЛОГИКА ---
    let gameState = 'MENU';
    let score = 0, wave = 1, waveTimer = 0, scoreTimer = 0, sessionCoins = 0;
    let stars = [], bullets = [], enemyBullets = [], asteroids = [], crystals = [], buffDrops = [];
    let boss = null;
    let activeBuffs = { shield: false, magnet: 0, x2: 0 }; // Таймеры для баффов

    // Фон
    for (let i = 0; i < 30; i++) {
      stars.push({ x: Math.random() * 500, y: Math.random() * 900, speed: 20 + Math.random() * 50, size: Math.random() * 2 });
    }

    const player = {
      x: width / 2, y: height - 100, radius: 18,
      targetX: width / 2, targetY: height - 100,
      shootTimer: 0,
      color: '#0284c7', weaponConfig: STORE.weapons[0]
    };

    // Управление
    let isTouching = false;
    function handlePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      player.targetX = clientX - rect.left;
      player.targetY = clientY - rect.top - 40; // Сдвиг для пальца
    }
    canvas.addEventListener('touchstart', (e) => { isTouching = true; handlePointer(e); }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { if (isTouching) handlePointer(e); }, { passive: true });
    canvas.addEventListener('touchend', () => { isTouching = false; });
    canvas.addEventListener('mousedown', (e) => { isTouching = true; handlePointer(e); });
    canvas.addEventListener('mousemove', (e) => { if (isTouching) handlePointer(e); });
    window.addEventListener('mouseup', () => { isTouching = false; });

    function startGame() {
      score = 0; wave = 1; waveTimer = 0; scoreTimer = 0; sessionCoins = 0;
      bullets = []; enemyBullets = []; asteroids = []; crystals = []; buffDrops = []; boss = null;
      activeBuffs = { shield: false, magnet: 0, x2: 0 };
      
      // Настройка скина и оружия
      const skin = STORE.skins.find(s => s.id === savedData.equippedSkin) || STORE.skins[0];
      player.color = skin.color;
      player.weaponConfig = STORE.weapons.find(w => w.id === savedData.equippedWeapon) || STORE.weapons[0];
      player.x = width / 2; player.y = height - 100;
      player.targetX = player.x; player.targetY = player.y;

      updateHUD();
      mainMenu.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      bossBarContainer.classList.add('hidden');
      gameState = 'PLAYING';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', () => {
      gameOverScreen.classList.add('hidden');
      mainMenu.classList.remove('hidden');
      updateMenuUI();
    });

    function gameOver() {
      gameState = 'GAMEOVER';
      if (score > savedData.highScore) savedData.highScore = score;
      savedData.coins += sessionCoins;
      saveData();
      
      document.getElementById('finalScore').innerText = score;
      document.getElementById('finalCoins').innerText = sessionCoins;
      hud.classList.add('hidden');
      bossBarContainer.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
    }

    function updateHUD() {
      scoreDisplay.innerText = score;
      waveDisplay.innerText = wave;
      coinsDisplay.innerText = sessionCoins;
      
      // Иконки баффов
      let buffsHtml = '';
      if (activeBuffs.shield) buffsHtml += '<span class="text-blue-400">🛡️</span>';
      if (activeBuffs.magnet > 0) buffsHtml += '<span class="text-purple-400">🧲</span>';
      if (activeBuffs.x2 > 0) buffsHtml += '<span class="text-amber-400">2X</span>';
      buffsDisplay.innerHTML = buffsHtml;
    }

    // --- ОСНОВНОЙ ЦИКЛ С DELTA TIME (Оптимизация скорости) ---
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05); // Ограничение скачков
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    let asteroidSpawnTimer = 0;
    function spawnAsteroid(dt) {
      if (boss) return;
      asteroidSpawnTimer += dt;
      const interval = Math.max(0.4, 1.2 - wave * 0.1);
      if (asteroidSpawnTimer > interval) {
        asteroidSpawnTimer = 0;
        const rand = Math.random();
        let radius = 14, hp = 1;
        if (rand > 0.8) { radius = 35; hp = 4; }
        else if (rand > 0.5) { radius = 22; hp = 2; }
        asteroids.push({ x: Math.random()*(width-40)+20, y: -40, radius, hp, speed: 60 + wave*10 + Math.random()*40 });
      }
    }

    function spawnLoot(x, y, radius, isBoss = false) {
      // Кристаллы по ТЗ
      let count = 0;
      if (isBoss) count = 15;
      else if (radius > 30) count = Math.floor(Math.random()*3)+3; // 3-5
      else if (radius > 18) count = Math.floor(Math.random()*2)+1; // 1-2
      else count = Math.random() < 0.7 ? 1 : 0; // 0-1

      for (let i=0; i<count; i++) {
        crystals.push({ x: x+(Math.random()*20-10), y: y+(Math.random()*20-10), speed: 70+Math.random()*30 });
      }

      // Баффы (Шанс 5% с обычных, 100% с босса)
      if (isBoss || Math.random() < 0.05) {
        const types = ['shield', 'magnet', 'x2'];
        const type = types[Math.floor(Math.random()*types.length)];
        buffDrops.push({ x, y, type, speed: 50 });
      }
    }

    function update(dt) {
      // Звезды
      stars.forEach(s => { s.y += s.speed * dt; if (s.y > height) { s.y = 0; s.x = Math.random()*width; }});
      
      if (gameState !== 'PLAYING') return;

      // Таймеры
      if (activeBuffs.magnet > 0) activeBuffs.magnet -= dt;
      if (activeBuffs.x2 > 0) activeBuffs.x2 -= dt;
      if (activeBuffs.magnet <= 0 || activeBuffs.x2 <= 0) updateHUD();

      scoreTimer += dt;
      if (scoreTimer >= 1.0) {
        scoreTimer = 0;
        score += activeBuffs.x2 > 0 ? 2 : 1;
        updateHUD();
      }

      waveTimer += dt;
      if (waveTimer >= 30) {
        waveTimer = 0; wave++; updateHUD();
        if (wave % 3 === 0 && !boss) {
          boss = { x: width/2, y: -60, radius: 45, maxHp: 30 + wave*10, hp: 30 + wave*10, dir: 1, timer: 0 };
          bossBarContainer.classList.remove('hidden');
        }
      }

      // Движение корабля
      player.x += (player.targetX - player.x) * (15 * dt);
      player.y += (player.targetY - player.y) * (15 * dt);
      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

      // Стрельба
      player.shootTimer += dt;
      if (player.shootTimer >= player.weaponConfig.rate) {
        player.shootTimer = 0;
        const wpn = player.weaponConfig.id;
        if (wpn === 'wpn_1') {
          bullets.push({x: player.x, y: player.y-10, vx: 0, vy: -500});
        } else if (wpn === 'wpn_2') {
          bullets.push({x: player.x-8, y: player.y-10, vx: 0, vy: -500});
          bullets.push({x: player.x+8, y: player.y-10, vx: 0, vy: -500});
        } else if (wpn === 'wpn_3') {
          bullets.push({x: player.x + (Math.random()*10-5), y: player.y-10, vx: 0, vy: -600});
        } else if (wpn === 'wpn_4') {
          bullets.push({x: player.x, y: player.y-10, vx: 0, vy: -500});
          bullets.push({x: player.x-10, y: player.y-10, vx: -100, vy: -480});
          bullets.push({x: player.x+10, y: player.y-10, vx: 100, vy: -480});
        }
      }

      // Обновление пуль
      for (let i=bullets.length-1; i>=0; i--) {
        bullets[i].x += bullets[i].vx * dt;
        bullets[i].y += bullets[i].vy * dt;
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      for (let i=enemyBullets.length-1; i>=0; i--) {
        enemyBullets[i].y += 250 * dt;
        if (Math.hypot(enemyBullets[i].x - player.x, enemyBullets[i].y - player.y) < player.radius - 2) {
          enemyBullets.splice(i, 1);
          if (activeBuffs.shield) { activeBuffs.shield = false; updateHUD(); }
          else { gameOver(); return; }
        }
        if (enemyBullets[i].y > height) enemyBullets.splice(i, 1);
      }

      // Астероиды
      spawnAsteroid(dt);
      for (let i=asteroids.length-1; i>=0; i--) {
        const a = asteroids[i];
        a.y += a.speed * dt;
        
        // Столкновение
        if (Math.hypot(a.x - player.x, a.y - player.y) < a.radius + player.radius - 4) {
          if (activeBuffs.shield) {
             activeBuffs.shield = false; updateHUD(); asteroids.splice(i,1); continue;
          } else { gameOver(); return; }
        }

        // Попадание
        for (let j=bullets.length-1; j>=0; j--) {
          if (Math.hypot(a.x - bullets[j].x, a.y - bullets[j].y) < a.radius) {
            bullets.splice(j, 1);
            a.hp--;
            if (a.hp <= 0) {
              spawnLoot(a.x, a.y, a.radius);
              score += activeBuffs.x2 > 0 ? 2 : 1;
              updateHUD();
              asteroids.splice(i, 1);
              break;
            }
          }
        }
        if (a && a.y > height) asteroids.splice(i, 1);
      }

      // Босс
      if (boss) {
        if (boss.y < 80) boss.y += 50 * dt;
        else {
          boss.x += 100 * boss.dir * dt;
          if (boss.x > width - boss.radius || boss.x < boss.radius) boss.dir *= -1;
          
          boss.timer += dt;
          const rate = boss.hp < boss.maxHp/2 ? 0.4 : 0.8;
          if (boss.timer > rate) {
            boss.timer = 0;
            enemyBullets.push({x: boss.x - 20, y: boss.y + 20});
            enemyBullets.push({x: boss.x + 20, y: boss.y + 20});
          }
        }

        for (let j=bullets.length-1; j>=0; j--) {
          if (Math.hypot(boss.x - bullets[j].x, boss.y - bullets[j].y) < boss.radius) {
            bullets.splice(j, 1);
            boss.hp--;
            bossBarFill.style.width = `${Math.max(0, boss.hp/boss.maxHp*100)}%`;
            if (boss.hp <= 0) {
              spawnLoot(boss.x, boss.y, boss.radius, true);
              boss = null;
              bossBarContainer.classList.add('hidden');
              break;
            }
          }
        }
      }

      // Лут (Кристаллы и Баффы)
      for (let i=crystals.length-1; i>=0; i--) {
        const c = crystals[i];
        c.y += c.speed * dt;
        if (activeBuffs.magnet > 0 && Math.hypot(c.x-player.x, c.y-player.y) < 120) {
          c.x += (player.x - c.x) * 10 * dt;
          c.y += (player.y - c.y) * 10 * dt;
        }
        if (Math.hypot(c.x - player.x, c.y - player.y) < player.radius) {
          sessionCoins++; updateHUD(); crystals.splice(i, 1);
        } else if (c.y > height) crystals.splice(i, 1);
      }

      for (let i=buffDrops.length-1; i>=0; i--) {
        const b = buffDrops[i];
        b.y += b.speed * dt;
        if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + 10) {
          if (b.type === 'shield') activeBuffs.shield = true;
          if (b.type === 'magnet') activeBuffs.magnet = 15; // 15 сек
          if (b.type === 'x2') activeBuffs.x2 = 15; // 15 сек
          updateHUD(); buffDrops.splice(i, 1);
        } else if (b.y > height) buffDrops.splice(i, 1);
      }
    }

    // --- ОПТИМИЗИРОВАННЫЙ РЕНДЕР (БЕЗ SHADOWBLUR) ---
    function render() {
      ctx.fillStyle = '#05050f';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#475569';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

      if (gameState !== 'PLAYING') return;

      // Баффы на арене
      buffDrops.forEach(b => {
        ctx.fillStyle = b.type === 'shield' ? '#60a5fa' : b.type === 'magnet' ? '#c084fc' : '#fbbf24';
        ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(b.type === 'x2' ? '2X' : b.type === 'shield' ? 'S' : 'M', b.x, b.y+3);
      });

      // Кристаллы
      ctx.fillStyle = '#10b981';
      crystals.forEach(c => {
        ctx.beginPath(); ctx.moveTo(c.x, c.y-6); ctx.lineTo(c.x+5, c.y); 
        ctx.lineTo(c.x, c.y+6); ctx.lineTo(c.x-5, c.y); ctx.fill();
      });

      // Пули
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x-2, b.y-8, 4, 16));
      ctx.fillStyle = '#ef4444';
      enemyBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

      // Астероиды
      asteroids.forEach(a => {
        ctx.fillStyle = '#334155'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.radius, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      });

      // Босс
      if (boss) {
        ctx.fillStyle = '#7f1d1d'; ctx.strokeStyle = '#f87171';
        ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ef4444'; ctx.fillRect(boss.x-15, boss.y+10, 6, 15); ctx.fillRect(boss.x+9, boss.y+10, 6, 15);
      }

      // Игрок
      ctx.save();
      ctx.translate(player.x, player.y);
      if (activeBuffs.shield) {
        ctx.strokeStyle = 'rgba(96, 165, 250, 0.6)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, player.radius + 8, 0, Math.PI*2); ctx.stroke();
      }
      
      ctx.fillStyle = player.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(16, 14); ctx.lineTo(0, 8); ctx.lineTo(-16, 14); ctx.closePath();
      ctx.fill(); ctx.stroke();
      
      // Огонь из двигателя
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(0, 20 + Math.random()*6); ctx.lineTo(6, 10); ctx.fill();
      ctx.restore();
    }

    updateMenuUI(); // Инициализация меню
  </script>
</body>
</html>
