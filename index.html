<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Galactic Shooter</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050f;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="bg-[#05050f] text-white font-sans flex items-center justify-center">

  <div id="game-container" class="relative w-full h-full max-w-[500px] max-h-[900px] overflow-hidden shadow-2xl">
    <canvas id="gameCanvas"></canvas>

    <!-- Внутриигровой HUD -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none transition-opacity duration-300">
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-full border border-cyan-500/30">
          <span class="text-cyan-400 font-bold text-sm">ДИСТАНЦИЯ:</span>
          <span id="scoreDisplay" class="font-extrabold text-cyan-300">0</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-purple-500/30 w-fit">
          <span class="text-purple-400 font-bold text-xs">ВОЛНА:</span>
          <span id="waveDisplay" class="font-bold text-purple-300 text-xs">1</span>
        </div>
      </div>
      <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-full border border-emerald-500/30">
        <svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 2l6 4.5-6 11.5L4 6.5 10 2z"/>
        </svg>
        <span id="coinsDisplay" class="font-extrabold text-emerald-300">0</span>
      </div>
    </div>

    <!-- Полоска здоровья Босса -->
    <div id="bossBarContainer" class="absolute top-16 left-1/2 -translate-x-1/2 w-3/4 max-w-[300px] bg-slate-950/80 border border-red-500/50 rounded-full p-1 hidden pointer-events-none">
      <div class="text-[10px] text-red-400 text-center font-bold uppercase tracking-wider mb-0.5">Вражеский Дредноут</div>
      <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden">
        <div id="bossBarFill" class="bg-gradient-to-r from-red-600 to-orange-500 h-full w-full transition-all duration-75"></div>
      </div>
    </div>

    <!-- Главное Меню -->
    <div id="mainMenu" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-between p-6 z-20">
      <div class="text-center mt-8">
        <h1 class="text-4xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-br from-cyan-400 via-sky-300 to-purple-500 drop-shadow">
          NEON SHOOTER
        </h1>
        <p class="text-xs text-slate-400 tracking-widest mt-1 uppercase">Telegram Edition</p>
      </div>

      <div class="flex flex-col items-center gap-3 w-full max-w-[280px]">
        <button id="startBtn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-black text-lg tracking-wider shadow-lg active:scale-95 transition-transform">
          ИГРАТЬ
        </button>

        <button id="supportBtn" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 rounded-xl font-bold text-sm tracking-wide shadow active:scale-95 transition-transform flex items-center justify-center gap-2">
          <span>⭐</span>
          <span id="supportBtnText">Поддержать (+1000 💎)</span>
        </button>
      </div>

      <div class="text-center text-xs text-slate-500 mb-2">
        Рекорд: <span id="highScoreDisplay" class="text-slate-300 font-bold">0</span> м
      </div>
    </div>

    <!-- Экран Game Over -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 hidden">
      <h2 class="text-3xl font-black text-red-500 tracking-wider mb-2">КОРАБЛЬ УНИЧТОЖЕН</h2>
      <p class="text-slate-400 text-sm mb-6">Космос ошибок не прощает</p>

      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 w-full max-w-[280px] flex flex-col gap-2 mb-6">
        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Пройдено:</span>
          <span id="finalScore" class="font-bold text-cyan-400">0 м</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Собрано кристаллов:</span>
          <span id="finalCoins" class="font-bold text-emerald-400">0</span>
        </div>
      </div>

      <button id="restartBtn" class="w-full max-w-[280px] py-3.5 bg-cyan-500 hover:bg-cyan-400 rounded-xl font-black text-slate-950 tracking-wider active:scale-95 transition-transform">
        В БОЙ СНОВА
      </button>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // false отключает лишний альфа-композитинг подложки
    const container = document.getElementById('game-container');

    // UI элементы
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const waveDisplay = document.getElementById('waveDisplay');
    const coinsDisplay = document.getElementById('coinsDisplay');
    const bossBarContainer = document.getElementById('bossBarContainer');
    const bossBarFill = document.getElementById('bossBarFill');
    const mainMenu = document.getElementById('mainMenu');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const finalScore = document.getElementById('finalScore');
    const finalCoins = document.getElementById('finalCoins');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const supportBtn = document.getElementById('supportBtn');
    const supportBtnText = document.getElementById('supportBtnText');

    // Настройки производительности (Ограничение DPR до 1.5 предотвращает троттлинг на экранах Retina)
    let width = 0;
    let height = 0;
    const DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    function resize() {
      const rect = container.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * DPR;
      canvas.height = height * DPR;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(DPR, DPR);
    }
    window.addEventListener('resize', resize);
    resize();

    // Игровое состояние
    let gameState = 'MENU';
    let coins = parseInt(localStorage.getItem('neon_coins') || '0', 10);
    let highScore = parseInt(localStorage.getItem('neon_high_score') || '0', 10);
    let isSupporter = localStorage.getItem('neon_supporter') === 'true';
    let score = 0;
    let wave = 1;
    let waveTimer = 0;
    let scoreTimer = 0;

    coinsDisplay.innerText = coins;
    highScoreDisplay.innerText = highScore;

    if (isSupporter) {
      supportBtnText.innerText = "Поддержка активна ✓";
      supportBtn.classList.add('opacity-60', 'pointer-events-none');
    }

    supportBtn.addEventListener('click', () => {
      if (!isSupporter) {
        isSupporter = true;
        coins += 1000;
        localStorage.setItem('neon_coins', coins);
        localStorage.setItem('neon_supporter', 'true');
        coinsDisplay.innerText = coins;
        supportBtnText.innerText = "Поддержка активна ✓";
        supportBtn.classList.add('opacity-60', 'pointer-events-none');
      }
    });

    // Игрок
    const player = {
      x: width / 2,
      y: height - 120,
      radius: 18,
      targetX: width / 2,
      targetY: height - 120,
      shootTimer: 0,
      shootInterval: 0.18
    };

    // Массивы сущностей
    let bullets = [];
    let enemyBullets = [];
    let asteroids = [];
    let crystals = [];
    let boss = null;
    let stars = [];

    // Создание заднего фона (звёзды)
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * 500,
        y: Math.random() * 900,
        speed: 20 + Math.random() * 60,
        size: Math.random() * 1.5 + 0.5
      });
    }

    // Управление тачем / пальцем
    let isTouching = false;
    function handlePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      player.targetX = clientX - rect.left;
      player.targetY = clientY - rect.top - 30; // Небольшой сдвиг вверх, чтобы корабль не закрывался пальцем
    }

    canvas.addEventListener('touchstart', (e) => { isTouching = true; handlePointer(e); }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { if (isTouching) handlePointer(e); }, { passive: true });
    canvas.addEventListener('touchend', () => { isTouching = false; });
    canvas.addEventListener('mousedown', (e) => { isTouching = true; handlePointer(e); });
    canvas.addEventListener('mousemove', (e) => { if (isTouching) handlePointer(e); });
    window.addEventListener('mouseup', () => { isTouching = false; });

    // Сброс и запуск
    function startGame() {
      score = 0;
      wave = 1;
      waveTimer = 0;
      scoreTimer = 0;
      bullets = [];
      enemyBullets = [];
      asteroids = [];
      crystals = [];
      boss = null;
      bossBarContainer.classList.add('hidden');

      player.x = width / 2;
      player.y = height - 120;
      player.targetX = player.x;
      player.targetY = player.y;

      scoreDisplay.innerText = '0';
      waveDisplay.innerText = '1';
      mainMenu.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      gameState = 'PLAYING';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function gameOver() {
      gameState = 'GAMEOVER';
      bossBarContainer.classList.add('hidden');
      finalScore.innerText = `${score} м`;
      finalCoins.innerText = crystals.length;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_high_score', highScore);
        highScoreDisplay.innerText = highScore;
      }
      localStorage.setItem('neon_coins', coins);
      gameOverScreen.classList.remove('hidden');
    }

    // Спавн астероидов
    let asteroidSpawnTimer = 0;
    function spawnAsteroid(dt) {
      if (boss) return; // Во время босса обычные астероиды не летят
      asteroidSpawnTimer += dt;
      const interval = Math.max(0.4, 1.2 - wave * 0.08);
      if (asteroidSpawnTimer > interval) {
        asteroidSpawnTimer = 0;
        const sizeType = Math.random();
        let radius = 14;
        let hp = 1;
        if (sizeType > 0.8) {
          radius = 34; // Большой
          hp = 4;
        } else if (sizeType > 0.45) {
          radius = 22; // Средний
          hp = 2;
        }
        asteroids.push({
          x: Math.random() * (width - 40) + 20,
          y: -40,
          radius: radius,
          hp: hp,
          speed: (60 + Math.random() * 50) + wave * 8
        });
      }
    }

    // Спавн кристаллов из сбитых объектов
    function spawnCrystals(x, y, radius) {
      let count = 0;
      if (radius > 30) {
        count = Math.floor(Math.random() * 3) + 3; // 3 - 5
      } else if (radius > 18) {
        count = Math.floor(Math.random() * 2) + 1; // 1 - 2
      } else {
        count = Math.random() < 0.7 ? 1 : 0;       // 0 - 1
      }

      for (let i = 0; i < count; i++) {
        crystals.push({
          x: x + (Math.random() * 20 - 10),
          y: y + (Math.random() * 20 - 10),
          speedY: 60 + Math.random() * 40
        });
      }
    }

    // Босс
    function spawnBoss() {
      boss = {
        x: width / 2,
        y: -80,
        targetY: 90,
        radius: 44,
        maxHp: 30 + wave * 15,
        hp: 30 + wave * 15,
        dir: 1,
        speedX: 90,
        shootTimer: 0
      };
      bossBarContainer.classList.remove('hidden');
    }

    // Основной цикл обновления на основе deltaTime
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05); // Ограничение dt для защиты от скачков кадров
      lastTime = now;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    function update(dt) {
      // Движение звезд фонового слоя
      for (let i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].speed * dt;
        if (stars[i].y > height) {
          stars[i].y = 0;
          stars[i].x = Math.random() * width;
        }
      }

      if (gameState !== 'PLAYING') return;

      // Начисление дистанции: +1 в секунду
      scoreTimer += dt;
      if (scoreTimer >= 1.0) {
        scoreTimer = 0;
        score += 1;
        scoreDisplay.innerText = score;
      }

      // Смена волн
      waveTimer += dt;
      if (waveTimer >= 30) {
        waveTimer = 0;
        wave += 1;
        waveDisplay.innerText = wave;
        if (wave % 3 === 0 && !boss) {
          spawnBoss();
        }
      }

      // Плавное следование корабля за пальцем
      player.x += (player.targetX - player.x) * (20 * dt);
      player.y += (player.targetY - player.y) * (20 * dt);
      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

      // Стрельба игрока
      player.shootTimer += dt;
      if (player.shootTimer >= player.shootInterval) {
        player.shootTimer = 0;
        bullets.push({ x: player.x - 7, y: player.y - 12, speed: 450 });
        bullets.push({ x: player.x + 7, y: player.y - 12, speed: 450 });
      }

      // Полет пуль
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed * dt;
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      // Полет пуль босса
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].y += enemyBullets[i].speed * dt;
        // Проверка столкновения с игроком
        const dist = Math.hypot(enemyBullets[i].x - player.x, enemyBullets[i].y - player.y);
        if (dist < player.radius + 3) {
          gameOver();
          return;
        }
        if (enemyBullets[i].y > height + 20) enemyBullets.splice(i, 1);
      }

      // Спавн и движение астероидов
      spawnAsteroid(dt);
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.y += a.speed * dt;

        // Столкновение корабля с астероидом
        if (Math.hypot(a.x - player.x, a.y - player.y) < a.radius + player.radius - 2) {
          gameOver();
          return;
        }

        // Попадание пуль в астероид
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius + 4) {
            bullets.splice(j, 1);
            a.hp -= 1;
            if (a.hp <= 0) {
              spawnCrystals(a.x, a.y, a.radius);
              score += 1;
              scoreDisplay.innerText = score;
              asteroids.splice(i, 1);
              break;
            }
          }
        }

        if (a && a.y > height + 50) asteroids.splice(i, 1);
      }

      // Поведение Босса
      if (boss) {
        if (boss.y < boss.targetY) {
          boss.y += 60 * dt;
        } else {
          boss.x += boss.speedX * boss.dir * dt;
          if (boss.x > width - boss.radius - 10) boss.dir = -1;
          if (boss.x < boss.radius + 10) boss.dir = 1;

          boss.shootTimer += dt;
          const bossFireRate = boss.hp < (boss.maxHp * 0.5) ? 0.45 : 0.8;
          if (boss.shootTimer >= bossFireRate) {
            boss.shootTimer = 0;
            enemyBullets.push({ x: boss.x - 16, y: boss.y + 20, speed: 200 });
            enemyBullets.push({ x: boss.x + 16, y: boss.y + 20, speed: 200 });
          }
        }

        // Попадание пуль в босса
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(boss.x - b.x, boss.y - b.y) < boss.radius + 6) {
            bullets.splice(j, 1);
            boss.hp -= 1;
            bossBarFill.style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;

            if (boss.hp <= 0) {
              // Разгром босса: много кристаллов
              for (let c = 0; c < 16; c++) {
                crystals.push({
                  x: boss.x + (Math.random() * 50 - 25),
                  y: boss.y + (Math.random() * 50 - 25),
                  speedY: 40 + Math.random() * 50
                });
              }
              boss = null;
              bossBarContainer.classList.add('hidden');
              break;
            }
          }
        }
      }

      // Движение и сбор кристаллов
      for (let i = crystals.length - 1; i >= 0; i--) {
        const c = crystals[i];
        c.y += c.speedY * dt;

        // Магнит к игроку при приближении
        const dist = Math.hypot(c.x - player.x, c.y - player.y);
        if (dist < 80) {
          c.x += (player.x - c.x) * (10 * dt);
          c.y += (player.y - c.y) * (10 * dt);
        }

        if (dist < player.radius + 12) {
          crystals.splice(i, 1);
          coins += 1;
          coinsDisplay.innerText = coins;
        } else if (c.y > height + 20) {
          crystals.splice(i, 1);
        }
      }
    }

    // Оптимизированный рендеринг без shadowBlur
    function render() {
      ctx.fillStyle = '#05050f';
      ctx.fillRect(0, 0, width, height);

      // Отрисовка звёзд
      ctx.fillStyle = '#475569';
      for (let i = 0; i < stars.length; i++) {
        ctx.fillRect(stars[i].x, stars[i].y, stars[i].size, stars[i].size);
      }

      if (gameState === 'MENU') return;

      // Пули игрока
      ctx.fillStyle = '#38bdf8';
      for (let i = 0; i < bullets.length; i++) {
        ctx.fillRect(bullets[i].x - 1.5, bullets[i].y - 6, 3, 10);
      }

      // Пули врагов
      ctx.fillStyle = '#ef4444';
      for (let i = 0; i < enemyBullets.length; i++) {
        ctx.beginPath();
        ctx.arc(enemyBullets[i].x, enemyBullets[i].y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Кристаллы
      ctx.fillStyle = '#34d399';
      for (let i = 0; i < crystals.length; i++) {
        const c = crystals[i];
        ctx.beginPath();
        ctx.moveTo(c.x, c.y - 6);
        ctx.lineTo(c.x + 5, c.y);
        ctx.lineTo(c.x, c.y + 6);
        ctx.lineTo(c.x - 5, c.y);
        ctx.closePath();
        ctx.fill();
      }

      // Астероиды
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      for (let i = 0; i < asteroids.length; i++) {
        const a = asteroids[i];
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Босс
      if (boss) {
        ctx.fillStyle = '#7f1d1d';
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(boss.x - 14, boss.y + 12, 6, 12);
        ctx.fillRect(boss.x + 8, boss.y + 12, 6, 12);
      }

      // Игрок (Неоновый истребитель)
      ctx.save();
      ctx.translate(player.x, player.y);

      // Стилизованный корабль
      ctx.fillStyle = '#0284c7';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(16, 16);
      ctx.lineTo(0, 10);
      ctx.lineTo(-16, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Двигатель
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(-5, 12);
      ctx.lineTo(0, 20 + Math.random() * 4);
      ctx.lineTo(5, 12);
      ctx.fill();

      ctx.restore();
    }
  </script>
</body>
</html>
